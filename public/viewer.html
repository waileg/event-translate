<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Translate - Asistente</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --ok:#34d399; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:680px; margin:0 auto; padding:20px 14px; display:flex; flex-direction:column; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { background:var(--accent); color:#0f172a; font-weight:700; border-radius:8px; padding:4px 10px; font-size:.9rem; }
  select { padding:8px; border-radius:8px; border:1px solid #334155; background:var(--card); color:var(--text); font-size:1rem; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin:14px 0; }
  .label { font-size:.8rem; color:#94a3b8; margin-bottom:8px; }
  #translated { font-size:1.4rem; line-height:1.55; min-height:60px; }
  #original { font-size:.95rem; color:#94a3b8; line-height:1.45; min-height:40px; max-height:150px; overflow-y:auto; }
  .status { display:flex; align-items:center; gap:8px; font-size:.85rem; color:#94a3b8; }
  .dot { width:9px; height:9px; border-radius:50%; background:#64748b; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .pulse { animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  footer { margin-top:auto; text-align:center; font-size:.75rem; color:#475569; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge" id="eventCode">…</span>
    <select id="lang">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
    </select>
  </header>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>

  <div class="card">
    <div class="label">Traducción en vivo</div>
    <div id="translated">Esperando al orador…</div>
  </div>
  <div class="card">
    <div class="label">Texto original</div>
    <div id="original"></div>
  </div>
  <footer>Event Translate — mantén esta pantalla abierta durante el evento</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const code = location.pathname.split("/").pop();
$("eventCode").textContent = code;
$("lang").value = localStorage.getItem("et_lang") || "en";
$("lang").addEventListener("change", () => {
  localStorage.setItem("et_lang", $("lang").value);
  $("translated").textContent = "Cambiando idioma…";
  if (ws?.readyState === 1) ws.send(JSON.stringify({ type: "lang", lang: $("lang").value }));
});

const evtSource = document.createElement("script");
let ws;
let lastText = null;

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/?event=${code}`);

  ws.onopen = () => {
    $("dot").classList.add("on");
    $("statusText").textContent = "Conectado";
    ws.send(JSON.stringify({ type: "lang", lang: $("lang").value }));
  };
  ws.onclose = () => {
    $("dot").classList.remove("on");
    $("statusText").textContent = "Reconectando…";
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "translation" && msg.lang === $("lang").value) {
      $("translated").textContent = msg.text;
      $("translated").classList.add("pulse");
      setTimeout(() => $("translated").classList.remove("pulse"), 600);
    } else if (msg.type === "speech") {
      lastText = msg.text;
      $("original").textContent = msg.text;
    }
  };
}

fetch(`/api/events/${code}`).then(r => r.ok ? r.json() : null).then(ev => {
  if (ev?.sourceLang) sessionStorage.setItem("et_src", ev.sourceLang);
  connect();
}).catch(() => connect());

fetch(`/api/events/${code}`).then(r => r.ok ? r.json() : null).then(ev => {
  if (ev?.sourceLang) sessionStorage.setItem("et_src", ev.sourceLang);
  connect();
}).catch(() => connect());
</script>
</body>
</html>
