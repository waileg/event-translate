<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Translate - Proyector</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; font-size:.85rem; color:#64748b; display:flex; justify-content:space-between; }
  header b { color:#38bdf8; }
  main { flex:1; display:flex; align-items:flex-end; justify-content:center; padding:4vw; }
  #subtitle { font-size:4.5vw; line-height:1.35; text-align:center; max-width:90vw; text-shadow:0 2px 8px #000; }
  #subtitle p { margin:.2em 0; transition:opacity 1.2s ease; }
  #subtitle p.old { opacity:.55; }
  #subtitle .empty { color:#334155; }
</style>
</head>
<body>
<header><span>Event Translate — <b>Proyector</b></span><span id="code"></span></header>
<main><div id="subtitle"><span class="empty">Esperando al orador…</span></div></main>
<script>
const MAX_LINES = 3;
const code = new URLSearchParams(location.search).get("event") || location.hash.slice(1);
document.getElementById("code").textContent = code ? "Evento " + code : "";

let lines = [];        // frases finales mostradas
let current = "";     // frase en curso (interim)
let lastFinal = "";    // ultimo texto final recibido (para no duplicar)

const channel = new BroadcastChannel("event-translate-" + (code || "default"));
channel.onmessage = (e) => {
  const msg = e.data;
  if (msg.type !== "subtitle") return;
  const text = (msg.text || "").trim();
  if (!text) return;

  if (text === lastFinal) { current = ""; render(); return; } // frase final ya vista como interim
  if (text.startsWith(lines.join(" ").slice(0, 20)) && lines.length && text === lines[lines.length - 1]) return;

  // si el texto nuevo empieza con lo acumulado, es la frase en curso creciendo
  current = text;
  const accumulated = lines.join(" ");
  if (accumulated && current.startsWith(accumulated)) current = current.slice(accumulated.length).trim();
  if (!current) { render(); return; }

  // deteccion de frase final: termina en puntuacion de cierre o baja de longitud
  if (/[.!?…]\s*$/.test(current)) {
    lines.push(current);
    lastFinal = text;
    current = "";
    if (lines.length > MAX_LINES) lines = lines.slice(-MAX_LINES);
  }
  render();
};

function render() {
  const el = document.getElementById("subtitle");
  const parts = lines.map((l, i) => `<p class="${i < lines.length - 1 ? "old" : ""}">${escapeHtml(l)}</p>`);
  if (current) parts.push(`<p class="old">${escapeHtml(current)}</p>`);
  el.innerHTML = parts.length ? parts.join("") : '<span class="empty">Esperando al orador…</span>';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
