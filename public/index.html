<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Translate - Orador</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --ok:#34d399; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; }
  h1 span { color:var(--accent); }
  .card { background:var(--card); border-radius:14px; padding:20px; margin:16px 0; }
  label { display:block; font-size:.85rem; color:#94a3b8; margin-bottom:6px; }
  select, input { width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); font-size:1rem; }
  button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#0f172a; font-weight:600; font-size:1rem; cursor:pointer; }
  button.danger { background:#f87171; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hidden { display:none; }
  .qr { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .qr img { width:220px; height:220px; border-radius:10px; background:#fff; padding:8px; }
  .status { display:flex; align-items:center; gap:8px; font-size:.9rem; color:#94a3b8; }
  .dot { width:10px; height:10px; border-radius:50%; background:#64748b; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #live { min-height:80px; font-size:1.15rem; line-height:1.5; }
  #live .interim { color:#94a3b8; }
  .code { font-family:monospace; font-size:2rem; letter-spacing:4px; color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
  a.qrlink { color:var(--accent); text-decoration:none; font-size:.9rem; word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Event <span>Translate</span> — Consola del orador</h1>

  <div id="setup" class="card">
    <label for="lang">Idioma en el que hablas</label>
    <select id="lang">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
    </select>
    <button id="createBtn">Crear evento</button>
  </div>

  <div id="console" class="hidden">
    <div class="card">
      <div class="row"><span class="code" id="code"></span></div>
      <div class="row"><button id="startBtn">🎤 Iniciar transcripción</button></div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Sin transmitir</span></div>
    </div>
    <div class="card qr">
      <img id="qrImg" alt="Código QR del evento">
      <a class="qrlink" id="qrUrl" target="_blank"></a>
    </div>
    <div class="card">
      <label>Proyector de subtítulos (otra pestaña/monitor de este PC)</label>
      <button id="projectorBtn">🖥️ Abrir vista proyector</button>
    </div>
    <div class="card">
      <label>Transcripción en vivo</label>
      <div id="live"></div>
    </div>
    <div id="langs"></div>
    <button class="danger" id="endBtn">Finalizar evento</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let eventCode = null;

async function createEvent() {
  const r = await fetch("/api/events", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sourceLang: $("lang").value })
  });
  const { code } = await r.json();
  eventCode = code;
  $("setup").classList.add("hidden");
  $("console").classList.remove("hidden");
  $("code").textContent = code;
  $("qrImg").src = `/api/events/${code}/qr`;
  const url = `${location.origin}/e/${code}`;
  $("qrUrl").textContent = url;
  $("qrUrl").href = url;
  startWebSocket();
}

function startWebSocket() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/?event=${eventCode}`);
  window.__ws = ws;
  window.__bc = new BroadcastChannel("event-translate-" + eventCode);
  window.__translators = new Map(); // lang -> Translator
  window.__langs = new Set();      // idiomas pedidos por los asistentes
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "lang") addLang(msg.lang);
  };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ---- Traduccion en el ordenador principal ----
const TARGETS = {
  en: "Traducción (English)", es: "Traducción (Español)", fr: "Traducción (Français)",
  de: "Traducción (Deutsch)", it: "Traducción (Italiano)", pt: "Traducción (Português)"
};

async function getTranslator(lang) {
  const t = window.__translators.get(lang);
  if (t !== undefined) return t;
  let tr = null;
  if ("Translator" in window && Translator.availability) {
    try {
      const status = await Translator.availability({ sourceLanguage: $("lang").value, targetLanguage: lang });
      if (status === "available" || status === "downloadable" || status === "downloading") {
        tr = await Translator.create({ sourceLanguage: $("lang").value, targetLanguage: lang });
      }
    } catch {}
  }
  window.__translators.set(lang, tr);
  return tr;
}

async function translateText(text, lang) {
  const tr = await getTranslator(lang);
  if (tr) {
    try { return await tr.translate(text); } catch { window.__translators.set(lang, null); }
  }
  const r = await fetch("/api/translate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, from: $("lang").value, to: lang })
  });
  if (!r.ok) throw new Error();
  return (await r.json()).text;
}

function addLang(lang) {
  if (!window.__langs) return;
  if (window.__langs.has(lang)) return;
  window.__langs.add(lang);
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<label>${escapeHtml(TARGETS[lang] || lang)}</label><div class="lang-live" id="live-${lang}">…</div>`;
  $("langs").appendChild(div);
}

async function broadcastTranslations(finalText, interimText) {
  for (const lang of window.__langs || []) {
    try {
      const src = interimText || finalText;
      if (!src) continue;
      const out = await translateText(src, lang);
      if (!out) continue;
      const el = $("live-" + lang);
      if (el) el.textContent = out;
      if (window.__ws?.readyState === 1) {
        window.__ws.send(JSON.stringify({ type: "translation", lang, text: out, isFinal: !!finalText && !interimText }));
      }
    } catch {}
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let baseText = "";

if (!SR) {
  document.addEventListener("DOMContentLoaded", () => {
    alert("Tu navegador no soporta reconocimiento de voz (Web Speech API). Usa Chrome o Edge en escritorio.");
  });
}

$("createBtn").addEventListener("click", createEvent);
$("startBtn").addEventListener("click", () => {
  if (!SR) return;
  recog = new SR();
  recog.continuous = true;
  recog.interimResults = true;
  recog.lang = { es:"es-ES", en:"en-US", fr:"fr-FR", de:"de-DE", it:"it-IT", pt:"pt-PT" }[$("lang").value] || "es-ES";

  recog.onstart = () => {
    $("dot").classList.add("on");
    $("statusText").textContent = "Transmitiendo en directo";
    $("startBtn").disabled = true;
  };
  recog.onerror = (e) => {
    $("statusText").textContent = `Error: ${e.error}`;
  };
  recog.onend = () => {
    $("dot").classList.remove("on");
    $("startBtn").disabled = false;
    if ($("statusText").textContent === "Transmitiendo en directo") $("statusText").textContent = "Sin transmitir";
  };
  recog.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) baseText += t + " ";
      else interim += t;
    }
    $("live").innerHTML = escapeHtml(baseText) + '<span class="interim">' + escapeHtml(interim) + "</span>";
    if (window.__ws?.readyState === 1) {
      window.__ws.send(JSON.stringify({ type:"speech", text: (baseText + interim).trim(), isFinal: false }));
      if (interim === "") window.__ws.send(JSON.stringify({ type:"speech", text: baseText.trim(), isFinal: true }));
    }
    if (window.__bc) {
      window.__bc.postMessage({ type:"subtitle", text: (baseText + interim).trim() });
    }
    broadcastTranslations(baseText.trim(), interim.trim());
  };
  recog.start();
});

$("endBtn").addEventListener("click", () => {
  try { recog?.stop(); } catch {}
  if (window.__ws?.readyState === 1) {
    window.__ws.send(JSON.stringify({ type: "end" }));
    setTimeout(() => location.reload(), 700);
  } else {
    location.reload();
  }
});

$("projectorBtn").addEventListener("click", () => {
  window.open(`/projector.html?event=${eventCode}`, "_blank");
});


</script>
</body>
</html>
